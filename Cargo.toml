[package]
name = "mpvd"
version = "2.2.1"
edition = "2024"
description = "MPV music player daemon"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.189"
rand = "0.10.2"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
